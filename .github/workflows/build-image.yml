# .github/workflows/build-image.yml — h3xler/threadfin-next-build reposuna konur
# Tetikleme: SADECE manuel (pinli upstream ref ile). Sunucuda build YOK.
name: build-threadfin-image
on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Upstream repo (owner/name)"
        required: true
        default: "Threadfin/Threadfin"
      upstream_ref:
        description: "Pinli upstream commit SHA (40 karakter)"
        required: true
        default: "6b9c0ccf16164eb362af0a44660228267734c5aa"
      image_tag:
        description: "GHCR tag (örn. 20261004-6b9c0ccf — 'latest' YOK)"
        required: true
        default: "20261004-6b9c0ccf"
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: threadfin-next
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            UPSTREAM_REPO=${{ inputs.upstream_repo }}
            UPSTREAM_REF=${{ inputs.upstream_ref }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.upstream_ref }}
            org.opencontainers.image.title=Threadfin_Next (IPTV restream)
# SÜRÜM STRATEJİSİ: her zaman pinli bir commit SHA + sürüm-tarih tag'i ile
# manuel tetikle. "latest" tag'i push'lanmaz ve Portainer'da kullanılmaz.
# Doğrulama: Actions log'unda "git log -1" satırı (pinli SHA) + "aarch64" satırı.
